<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>SideQuest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card" id="card">
    <div class="icon-stack">
      <button id="btn-settings" class="icon-bubble" data-i18n-title="overlay.settings.title" title="Réglages">⚙</button>
      <div class="icon-bubble mini-timer" id="mini-timer" data-i18n-title="overlay.timer.title" title="Temps restant">
        <div class="mini-timer-fill" id="mini-timer-fill"></div>
      </div>
      <div class="icon-bubble blocking-badge" id="blocking-badge" data-i18n-title="overlay.blocking.title" title="Séance obligatoire" hidden>🔒</div>
      <button id="btn-done" class="icon-bubble icon-bubble-primary" data-i18n-title="overlay.done" title="C'est fait 💪">✔</button>
      <button id="btn-skip" class="icon-bubble" data-i18n-title="overlay.skip" title="Passer">⏭</button>
    </div>
    <img id="mascot-img" class="mascot" src="" alt="Mascotte" />
    <div class="content">
      <p class="label" data-i18n="overlay.label">C'est l'heure de bouger !</p>
      <p class="exercise" id="exercise-label">—</p>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="../shared/mascots.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
